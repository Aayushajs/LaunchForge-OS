version: 2
updates:
  # Major npm upgrades routinely break the build (they need code changes),
  # so they are done by hand; Dependabot keeps minor and patch versions fresh.
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    ignore:
      - dependency-name: "*"
        update-types: ["version-update:semver-major"]
    # Patches are grouped; minor updates arrive one per PR so a breaking
    # 0.x "minor" (drizzle-zod 0.5 to 0.8, for example) cannot hide among
    # a hundred safe ones.
    groups:
      patches:
        update-types: [patch]
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    groups:
      actions:
        patterns: ["*"]
  # The Node major is pinned by .nvmrc and package.json engines.
  - package-ecosystem: docker
    directory: /
    schedule:
      interval: weekly
    ignore:
      - dependency-name: node
        update-types: ["version-update:semver-major"]
  - package-ecosystem: gomod
    directory: /apps/monitoring
    schedule:
      interval: weekly
