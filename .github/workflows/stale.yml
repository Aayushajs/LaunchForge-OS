name: Stale

on:
  schedule:
    - cron: "0 6 * * 1"
  workflow_dispatch:

permissions:
  issues: write
  pull-requests: write

jobs:
  stale:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/stale@v11
        with:
          days-before-stale: 60
          days-before-close: 14
          stale-issue-label: stale
          stale-pr-label: stale
          exempt-issue-labels: security,pinned
          stale-issue-message: "No activity for 60 days. This will be closed in 14 days unless there is new activity."
          stale-pr-message: "No activity for 60 days. This will be closed in 14 days unless there is new activity."
