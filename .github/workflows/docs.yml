name: Docs

on:
  push:
    branches: [main]
    paths: ["**/*.md", ".github/workflows/docs.yml"]
  pull_request:
    branches: [main]
    paths: ["**/*.md", ".github/workflows/docs.yml"]

permissions:
  contents: read

jobs:
  links:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Check links between documents
        uses: lycheeverse/lychee-action@v2
        with:
          # Offline: verify every relative link and anchor in the repository;
          # external sites are skipped so the check is not flaky.
          args: --offline --no-progress "README.md" "docs/**/*.md" "CONTRIBUTING.md" "SECURITY.md"
          fail: true
