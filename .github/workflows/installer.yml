name: Installer

on:
  push:
    branches: [main]
    paths:
      - "scripts/install.sh"
      - "Dockerfile"
      - "apps/dokploy/bootstrap.ts"
      - "apps/dokploy/esbuild.config.ts"
      - ".github/workflows/installer.yml"
  pull_request:
    branches: [main]
    paths:
      - "scripts/install.sh"
      - "Dockerfile"
      - "apps/dokploy/bootstrap.ts"
      - ".github/workflows/installer.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  shellcheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - run: shellcheck --severity=warning scripts/install.sh

  e2e:
    name: install on ${{ matrix.os }}
    needs: shellcheck
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-22.04, ubuntu-24.04]
    env:
      LAUNCHFORGE_SKIP_PULL: "1"
      # GitHub-hosted runners have less free disk than a real server needs.
      LAUNCHFORGE_MIN_DISK_GB: "5"
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Build the panel image
        run: |
          cp apps/dokploy/.env.production.example .env.production
          cp apps/dokploy/.env.production.example apps/dokploy/.env.production
          docker build -t launchforge:ci .

      - name: Install
        run: sudo -E bash scripts/install.sh install --yes --image launchforge --version ci

      - name: Dashboard answers and the stack is up
        run: |
          curl -fsS http://127.0.0.1:3000/api/health
          sudo -E bash scripts/install.sh status
          docker service ls
          docker ps --filter name=dokploy-traefik --format '{{.Status}}' | grep -q Up

      - name: Re-running install is idempotent
        run: sudo -E bash scripts/install.sh install --yes --image launchforge --version ci

      - name: Upgrade backs up the database and stays healthy
        run: |
          sudo -E bash scripts/install.sh upgrade --yes --image launchforge --version ci
          ls -l /etc/dokploy/backups/pre-upgrade-*.sql.gz

      - name: Uninstall with purge
        run: |
          sudo -E bash scripts/install.sh uninstall --yes --purge
          ! docker service inspect dokploy >/dev/null 2>&1

      - name: Logs on failure
        if: failure()
        run: |
          docker service ls || true
          docker service logs dokploy --tail 200 || true
          docker service logs dokploy-postgres --tail 50 || true
          docker logs dokploy-traefik --tail 50 || true
