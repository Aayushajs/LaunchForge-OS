name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: ${{ matrix.job }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        job: [build, test, typecheck]
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm

      # GitHub release downloads fail intermittently (504s); retry with
      # backoff so an outage does not turn every run red.
      - name: Install Nixpacks
        if: matrix.job == 'test'
        run: |
          for attempt in 1 2 3 4 5; do
            curl -fsSL --retry 3 --retry-delay 5 \
              "https://github.com/railwayapp/nixpacks/releases/download/v1.41.0/nixpacks-v1.41.0-x86_64-unknown-linux-musl.tar.gz" \
              | sudo tar -xz -C /usr/local/bin nixpacks && break
            sleep $((attempt * 15))
          done
          nixpacks --version

      - name: Install Railpack
        if: matrix.job == 'test'
        run: |
          for attempt in 1 2 3 4 5; do
            curl -fsSL https://railpack.com/install.sh | RAILPACK_VERSION=0.15.4 bash && break
            sleep $((attempt * 15))
          done
          railpack --version

      - name: Add build tools to PATH
        if: matrix.job == 'test'
        run: echo "$HOME/.local/bin" >> "$GITHUB_PATH"

      # Deployment tests talk to a real Docker daemon and expect Swarm mode
      # plus the platform overlay network.
      - name: Initialize Docker Swarm
        if: matrix.job == 'test'
        run: |
          docker swarm init
          docker network create --driver overlay --attachable dokploy-network || true

      - run: pnpm install --frozen-lockfile
      - run: pnpm server:build
      - run: pnpm ${{ matrix.job }}

  format:
    name: format
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec biome format .

  monitoring:
    name: monitoring (go)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/monitoring
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-go@v7
        with:
          go-version-file: apps/monitoring/go.mod
          cache-dependency-path: apps/monitoring/go.sum
      - run: go build ./...
