name: Demo video

# Installs the latest edge image on a fresh runner with the real installer and
# records a narrated walkthrough (tests/demo/demo.mjs) as an MP4 plus
# screenshots of every step.
on:
  workflow_dispatch:
  release:
    types: [published]

permissions:
  contents: read
  packages: read
  actions: write

jobs:
  record:
    runs-on: ubuntu-24.04
    env:
      LAUNCHFORGE_MIN_DISK_GB: "5"
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Install LaunchForge
        run: |
          IMAGE="ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/launchforge"
          sudo -E bash scripts/install.sh install --yes --image "$IMAGE" --version edge 2>&1 \
            | sed -E 's/\x1b\[[0-9;]*m//g' | tee tests/demo/install.log

      - uses: actions/setup-node@v7
        with:
          node-version: 24

      # Run outside the pnpm workspace so npm does not try to resolve the
      # repository's workspace: dependencies.
      - name: Install Playwright and ffmpeg
        run: |
          mkdir -p "$RUNNER_TEMP/demo"
          cp tests/demo/demo.mjs tests/demo/install.log "$RUNNER_TEMP/demo/"
          cd "$RUNNER_TEMP/demo"
          npm init -y >/dev/null
          npm install --no-audit --no-fund playwright@1.49.1
          npx playwright install --with-deps chromium
          sudo apt-get install -y ffmpeg >/dev/null

      - name: Record the walkthrough
        working-directory: ${{ runner.temp }}/demo
        env:
          INSTALL_LOG: install.log
        run: node demo.mjs

      - name: Convert to MP4
        if: always()
        working-directory: ${{ runner.temp }}/demo
        run: |
          VIDEO=$(ls demo-output/video/*.webm | head -1)
          ffmpeg -y -loglevel error -i "$VIDEO" -c:v libx264 -preset slow -crf 30             -pix_fmt yuv420p -movflags +faststart demo-output/launchforge-demo.mp4
          ls -lh demo-output

      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: launchforge-demo
          path: |
            ${{ runner.temp }}/demo/demo-output/launchforge-demo.mp4
            ${{ runner.temp }}/demo/demo-output/screens/
            ${{ runner.temp }}/demo/demo-output/site/
          retention-days: 90

      # The product website shows the dashboard of the latest release.
      - name: Publish the website with the new screenshots
        if: success()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh workflow run pages.yml --repo "$GITHUB_REPOSITORY" --ref main

      - name: Logs on failure
        if: failure()
        run: docker service logs dokploy --tail 200 || true
