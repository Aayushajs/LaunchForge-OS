name: Website

on:
  push:
    branches: [main]
    paths:
      - "website/**"
      - "docs/assets/demo/**"
      - ".github/workflows/pages.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      # The dashboard screenshots live with the docs; copy them in rather
      # than keeping a second copy in the repository.
      - name: Assemble the site
        run: |
          mkdir -p _site/assets/screens
          cp -r website/. _site/
          cp docs/assets/demo/03-application-general.png docs/assets/demo/09-usage-quotas.png _site/assets/screens/

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
