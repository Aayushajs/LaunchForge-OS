name: Website

on:
  push:
    branches: [main]
    paths:
      - "website/**"
      - "scripts/install.sh"
      - ".github/workflows/pages.yml"
  workflow_dispatch:

permissions:
  contents: read
  actions: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Assemble the site
        run: |
          mkdir -p _site/assets/screens
          cp -r website/. _site/
          # Served at <site>/install.sh so the install command stays short.
          cp scripts/install.sh _site/install.sh
          cp docs/assets/demo/launchforge-demo.mp4 _site/assets/

      # Dark, caption-free screenshots of the latest release, taken by the
      # Demo video workflow. The documentation screenshots are the fallback.
      - name: Add dashboard screenshots
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          RUN=$(gh run list --repo "$GITHUB_REPOSITORY" --workflow demo.yml --branch main \
            --status success --limit 1 --json databaseId --jq '.[0].databaseId // empty')
          if [ -n "$RUN" ] && gh run download "$RUN" --repo "$GITHUB_REPOSITORY" -n launchforge-demo -D demo \
             && [ -d demo/site ] && [ -n "$(ls demo/site)" ]; then
            cp demo/site/*.png _site/assets/screens/
            [ -f demo/launchforge-demo.mp4 ] && cp demo/launchforge-demo.mp4 _site/assets/
            echo "Using screenshots from demo run $RUN"
          else
            for pair in application:03-application-general deployments:04-deployments domains:05-domains \
                        logs:07-logs environment:08-environment-services usage:09-usage-quotas \
                        audit-log:11-audit-log monitoring:12-monitoring users:10-users-roles; do
              cp "docs/assets/demo/${pair#*:}.png" "_site/assets/screens/${pair%%:*}.png"
            done
            echo "Using documentation screenshots"
          fi
          ls _site/assets/screens

      - uses: actions/configure-pages@v6

      - uses: actions/upload-pages-artifact@v5
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
